services:
  db:
    image: postgres:16-alpine
    container_name: nawy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apartments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nawy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apartments_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: nawy-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      DB_HOST: nawy-db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: apartments_db
      DB_SYNCHRONIZE: "true"
      IGNORE_ENV_FILE: "true"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - nawy
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    container_name: nawy-frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    networks:
      - nawy
    depends_on:
      - backend

networks:
  nawy:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
